[package]
name = "snapnab"
version = "0.4.1"
description = "Snapnab.exe, the capture app (tray, presets, hotkeys, captures), in egui on top of snapcore and snapui"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "snapnab_app"
path = "src/lib.rs"

[[bin]]
name = "Snapnab"
path = "src/main.rs"

[dependencies]
egui = "0.37"
snapcore = { path = "../snapcore" }
snapui = { path = "../snapui" }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
