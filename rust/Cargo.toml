# AnyCapture's Rust workspace (docs/ARCHITECTURE.md): AnyCapture.exe, AnyCaptureEditor.exe, SnapEx64.dll and AnyCaptureTool.exe.
# Every crate shares this lockfile, the target folder and the release profile; build.bat builds and packages them.
[workspace]
members = ["snapcore", "snapedit", "snapex", "anycapture", "snaptool", "snapui"]
resolver = "3"

[workspace.package]
# the product version (the executables, the package and the installer read it here)
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
