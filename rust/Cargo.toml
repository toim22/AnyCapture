# Snapnab's Rust workspace (the C++ to Rust migration, docs/ARCHITECTURE.md). Every crate shares this lockfile, the
# target folder and the release profile; CMake builds them through Corrosion (src/CMakeLists.txt).
[workspace]
members = ["snapcore", "snapedit", "snapex", "snapnab", "snapui"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
