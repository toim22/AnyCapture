[package]
name = "snapcore"
version = "0.1.0"
edition = "2024"
description = "The .snap container of Snapnab (pilot of the Rust migration)"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cfb = "0.16.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
