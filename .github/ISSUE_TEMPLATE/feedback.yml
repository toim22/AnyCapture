name: Suggest an improvement or send feedback
description: An idea, something that could work better, or anything you would like to tell us.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feedback! You can write in English or Portuguese.
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion or feedback
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do? How do you work around it today?
  - type: input
    id: version
    attributes:
      label: AnyCapture version
      placeholder: "0.5.0"
