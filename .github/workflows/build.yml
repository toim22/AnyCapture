# Builds Snapnab on GitHub Actions with the same build.bat used locally.
# The artifacts produced here are the ones that will be sent to SignPath
# for code signing (signing must start from a CI build of the public source).
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # the installer's Windows 11 style needs Inno Setup 6.7 or later, and the runner's own copy may be older (its
      # executables carry no version number to check): installs or upgrades it to the current one
      - name: Install Inno Setup 6.7+
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      # The golden references come from a Windows 11 machine; Windows Server draws a few edge pixels differently, so
      # here the golden checks compare everything but the pixel hashes (rust/snapedit/tests/golden.rs).
      - name: Rust tests (rust/)
        shell: cmd
        env:
          SNAPNAB_GOLDEN_PIXELS: loose
        run: cargo test --locked --release --workspace --manifest-path rust/Cargo.toml

      - name: Build and package
        shell: cmd
        run: build.bat

      - name: Check outputs
        shell: pwsh
        run: |
          foreach ($pattern in 'dist\Snapnab\Snapnab.exe', 'dist\Snapnab\SnapnabEditor.exe', 'dist\Snapnab\SnapEx64.dll',
                               'dist\Snapnab-*-win-x64.zip', 'dist\Snapnab-*-setup.exe') {
            if (-not (Test-Path $pattern)) { throw "missing: $pattern" }
          }
          Get-ChildItem dist\Snapnab-* | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name
          } | Tee-Object dist\SHA256SUMS.txt

      - name: Upload program folder
        uses: actions/upload-artifact@v7
        with:
          name: Snapnab-program
          path: dist/Snapnab/
          if-no-files-found: error

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: Snapnab-packages
          path: |
            dist/Snapnab-*-win-x64.zip
            dist/Snapnab-*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: Snapnab-symbols
          path: dist/symbols/
          if-no-files-found: warn
